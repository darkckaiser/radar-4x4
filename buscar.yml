name: Buscar anuncios
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: buscar
  cancel-in-progress: false
jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scraper.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - name: Guardar resultados
        run: |
          git config user.name "rastreador"
          git config user.email "rastreador@users.noreply.github.com"
          git add data/listings.json
          git diff --staged --quiet || (git commit -m "Actualiza anuncios" && git push)
