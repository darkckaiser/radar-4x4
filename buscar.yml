name: Buscar anuncios
# Cada turno rastrea cada 10 minutos durante ~45 min y al terminar se relanza solo.
# El reloj (cada 15 min) es una red de seguridad: si la cadena se interrumpe, la reanuda sola.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: buscar
  cancel-in-progress: false
jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Rastrear cada 10 minutos
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          git config user.name "rastreador"
          git config user.email "rastreador@users.noreply.github.com"
          fin=$((SECONDS + 2700))
          while true; do
            git pull --rebase --autostash -q || true
            timeout 840 python scraper.py || echo "Vuelta interrumpida por tiempo"
            git add data/listings.json
            if ! git diff --staged --quiet; then
              git commit -q -m "Actualiza anuncios"
              git pull --rebase -q || true
              git push -q || true
            fi
            [ "$SECONDS" -ge "$fin" ] && break
            sleep 600
          done
      - name: Relanzar el siguiente turno
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            gh workflow run buscar.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}" && exit 0
            sleep 15
          done
          exit 1
